<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Luigi Pirandello</title>

  <style>
    :root{
      --bg:#0f141a;
      --card:#1d2630;
      --cardHover:#263444;
      --border:#324050;
      --text:#e8edf5;
      --muted:rgba(232,237,245,.75);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .layout{
      max-width:1200px;
      margin:0 auto;
      padding:24px 16px;
      display:grid;
      grid-template-columns: 1fr 340px;
      gap:18px;
    }

    .index{
      display:grid;
      gap:10px;
    }

    a.card{
      display:block;
      padding:12px 14px;
      border-radius:14px;
      background:var(--card);
      color:var(--text);
      text-decoration:none;
      border:1px solid var(--border);
      transition:all .12s ease;
    }

    a.card:hover{
      background:var(--cardHover);
      transform:translateY(-1px);
    }

    a.card span{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-top:2px;
      padding-left:10px;
    }

    .portrait{
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.25);
    }

    .portrait img{
      width:100%;
      height:auto;
      display:block;
    }

    @media (max-width: 860px){
      .layout{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <main class="layout">

    <section class="index">
      <a class="card" href="Pirandello.html">
        1. Visione del mondo
      </a>

      <a class="card" href="Umorismo.html">
        2. L’umorismo
      </a>

      <a class="card" href="Novelle.html">
        3. Le novelle
        <span>• Il treno ha fischiato</span>
      </a>

      <a class="card" href="Romanzi.html">
        4. I romanzi
        <span>• Il fu Mattia Pascal</span>
        <span>• Uno, nessuno e centomila</span>
      </a>

      <a class="card" href="Teatro.html">
        5. Il teatro
        <span>• Così è (se vi pare)</span>
        <span>• Sei personaggi in cerca d’autore</span>
      </a>

      <a class="card" href="Conclusione.html">
        6. Conclusione
      </a>
    </section>

    <aside class="portrait">
      <img src="assets/Pirandello-ritratto.png" alt="Luigi Pirandello">
    </aside>

  </main>
</body>
</html>
